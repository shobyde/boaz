name: release

# Cuts a GitHub release for every version tag, with the tarball the site installs
# attached, and publishes the package to npm. Pushing a tag is the whole release.
#
# Auth, in order of preference:
#   1. trusted publishing: the repo variable NPM_TRUSTED_PUBLISHER is "true" and
#      npmjs.com has this workflow as a trusted publisher for @shobyde/boaz
#      (`npm trust github @shobyde/boaz --file release.yml --repo shobyde/boaz
#      --allow-publish`). No secret exists at all, and provenance comes from OIDC.
#   2. a granular access token in the NPM_TOKEN secret. Publishing directly needs
#      it to bypass 2FA, since npm refuses direct publishes with a plain token.
#   3. neither: the npm step is skipped, the run stays green, and the tarball on
#      the GitHub release is the install path.
#
# Set the repo variable NPM_STAGE=true to stage instead of publish: CI then runs
# `npm stage publish`, which needs no 2FA, and a human runs
# `npm stage approve <stage-id>` to make the version installable. Staging is the
# safer default (a stolen CI credential cannot ship a release on its own) but it
# costs one approval per release, so publishing directly is the default here.
#
# A tag whose version is already on the registry is a no-op rather than a
# failure, so re-running a release is safe.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # create the release and attach the tarball
  id-token: write # provenance, and trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # 24 ships npm 11.x: trusted publishing and `npm stage` need 11.5.1+
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter boaz test

      - name: Check that the tag matches the package version
        run: |
          pkg=$(node -p "require('./packages/boaz/package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$pkg" != "$tag" ]; then
            echo "tag $tag does not match package version $pkg"
            exit 1
          fi
          echo "version $pkg"

      - name: Pack the tarball the site installs
        run: |
          cd packages/boaz
          npm pack --pack-destination "$GITHUB_WORKSPACE"
          ls -l "$GITHUB_WORKSPACE"/*.tgz

      # Before npm, so a failed publish still leaves an installable release.
      - name: Attach the tarball to the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          tgz=$(ls ./*.tgz)
          echo "attaching $tgz to $tag"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "$tgz" --clobber
          else
            gh release create "$tag" "$tgz" --title "boaz ${tag#v}" --generate-notes
          fi

      - name: Publish to npm
        id: npm
        working-directory: packages/boaz
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -o pipefail
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")

          # A re-run of a tag whose version is already live has nothing to do.
          if npm view "${name}@${version}" version > /dev/null 2>&1; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${name}@${version} is already published; nothing to do."
            {
              echo "### ${name}@${version} is already published"
              echo ""
              echo "Nothing published: this version already exists on the registry, so"
              echo "re-running the tag is a no-op instead of a failure."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ -n "$NODE_AUTH_TOKEN" ]; then
            how="the NPM_TOKEN secret"
          elif [ "${{ vars.NPM_TRUSTED_PUBLISHER }}" = "true" ]; then
            unset NODE_AUTH_TOKEN
            how="trusted publishing (OIDC)"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No npm credential configured, so ${name}@${version} was not published. The tarball on the GitHub release is the install path."
            {
              echo "### Not published to npm"
              echo ""
              echo "No npm credential: neither an \`NPM_TOKEN\` secret nor the"
              echo "\`NPM_TRUSTED_PUBLISHER\` repo variable is set. The tarball on the"
              echo "GitHub release is the install path."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "${{ vars.NPM_STAGE }}" = "true" ]; then
            echo "::notice::NPM_STAGE=true, staging ${version} for approval instead of publishing"
            verb="stage publish"
          else
            echo "publishing with ${how}"
            verb="publish"
          fi

          # Not left to bash -e: a failed npm step must say so in the summary.
          if ! npm $verb --access public --provenance 2>&1 | tee npm-output.txt; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            {
              echo "### npm $verb failed for ${version}"
              echo ""
              echo '```'
              grep -iE 'npm (error|warn)' npm-output.txt | tail -20
              tail -n 5 npm-output.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "published=true" >> "$GITHUB_OUTPUT"
          {
            echo "### ${version} published to npm with ${how}"
            echo ""
            echo '```'
            tail -n 6 npm-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$verb" = "stage publish" ]; then
            {
              echo ""
              echo "Staged, not installable yet. Approve or reject it yourself:"
              echo ""
              echo '```'
              echo "npm stage list ${name}"
              echo "npm stage approve <stage-id>   # publishes ${version}"
              echo "npm stage reject <stage-id>    # throws it away"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
