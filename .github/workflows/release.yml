name: release

# Cuts a GitHub release for every version tag, with the tarball the site installs
# attached, and publishes to npm once an NPM_TOKEN secret exists (a granular npm
# access token with read and write on the boaz package). Without the
# token the npm step is skipped instead of failing, so the tag still produces a
# green release and an installable tarball.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # create the release and attach the tarball
  id-token: write # provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter boaz test

      - name: Check that the tag matches the package version
        run: |
          pkg=$(node -p "require('./packages/boaz/package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$pkg" != "$tag" ]; then
            echo "tag $tag does not match package version $pkg"
            exit 1
          fi
          echo "publishing $pkg"

      - name: Pack the tarball the site installs
        run: |
          cd packages/boaz
          npm pack --pack-destination "$GITHUB_WORKSPACE"
          ls -l "$GITHUB_WORKSPACE"/boaz-*.tgz

      - name: Publish to npm
        working-directory: packages/boaz
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "No NPM_TOKEN secret. Skipping npm publish: the tarball on the GitHub release is the install path."
            exit 0
          fi
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Attach the tarball to the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          tgz=$(ls boaz-*.tgz)
          echo "attaching $tgz to $tag"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "$tgz" --clobber
          else
            gh release create "$tag" "$tgz" --title "boaz ${tag#v}" --generate-notes
          fi
