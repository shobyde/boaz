name: release

# Cuts a GitHub release for every version tag, with the tarball the site installs
# attached, and publishes to npm once an NPM_TOKEN secret exists (a granular npm
# access token with read and write on the boaz package). Without the
# token the npm step is skipped instead of failing, so the tag still produces a
# green release and an installable tarball.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # create the release and attach the tarball
  id-token: write # provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # 24 ships npm 11.x: trusted publishing (OIDC) needs CLI 11.5.1+
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter boaz test

      - name: Check that the tag matches the package version
        run: |
          pkg=$(node -p "require('./packages/boaz/package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$pkg" != "$tag" ]; then
            echo "tag $tag does not match package version $pkg"
            exit 1
          fi
          echo "publishing $pkg"

      - name: Pack the tarball the site installs
        run: |
          cd packages/boaz
          npm pack --pack-destination "$GITHUB_WORKSPACE"
          ls -l "$GITHUB_WORKSPACE"/boaz-*.tgz

      - name: Publish to npm
        working-directory: packages/boaz
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Three ways in, in order of preference:
          #   1. a token secret (bootstrap, or a bypass-2FA granular token)
          #   2. trusted publishing: the repo variable NPM_TRUSTED_PUBLISHER is
          #      "true" and npmjs.com has this workflow as a trusted publisher,
          #      so the CLI authenticates over OIDC and there is no secret at all
          #   3. nothing configured: keep the tarball-only release green
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "publishing with the NPM_TOKEN secret"
            npm publish --access public --provenance
          elif [ "${{ vars.NPM_TRUSTED_PUBLISHER }}" = "true" ]; then
            echo "publishing with trusted publishing (OIDC)"
            unset NODE_AUTH_TOKEN
            npm publish --access public --provenance
          else
            echo "No npm credential. Skipping npm publish: the tarball on the GitHub release is the install path."
          fi

      - name: Attach the tarball to the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          tgz=$(ls boaz-*.tgz)
          echo "attaching $tgz to $tag"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "$tgz" --clobber
          else
            gh release create "$tag" "$tgz" --title "boaz ${tag#v}" --generate-notes
          fi
