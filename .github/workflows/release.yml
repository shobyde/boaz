name: release

# Cuts a GitHub release for every version tag with the tarball the site installs
# attached, and STAGES the package on npm instead of publishing it.
#
# Staging (`npm stage publish`) needs no 2FA and works with any token type, so a
# CI runner can do it unattended. The publish itself stays a human act: someone
# runs `npm stage approve <stage-id>` with their authenticator. A staged version
# is not installable and not visible to anyone until that happens.
#
# Two ways to authenticate the staging step, in order of preference:
#   1. trusted publishing: the repo variable NPM_TRUSTED_PUBLISHER is "true" and
#      npmjs.com has this workflow as a trusted publisher for boaz, with stage
#      publishing allowed (npm trust github boaz --file release.yml
#      --allow-stage-publish). No secret exists at all.
#   2. a granular access token in the NPM_TOKEN secret. It does NOT need 2FA
#      bypass: bypass is only needed to publish directly, which this workflow
#      never does. Scope it to boaz, read and write.
#   3. neither: the npm step is skipped, the run stays green, and the tarball on
#      the GitHub release is the install path.
#
# Staging requires the package to already exist on the registry, so the very
# first version was published by hand (`npm publish --access public`, one 2FA
# prompt) and every version after it is staged here.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # create the release and attach the tarball
  id-token: write # provenance, and trusted publishing

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # 24 ships npm 11.x: npm stage and trusted publishing need 11.5.1+
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter boaz test

      - name: Check that the tag matches the package version
        run: |
          pkg=$(node -p "require('./packages/boaz/package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$pkg" != "$tag" ]; then
            echo "tag $tag does not match package version $pkg"
            exit 1
          fi
          echo "version $pkg"

      - name: Pack the tarball the site installs
        run: |
          cd packages/boaz
          npm pack --pack-destination "$GITHUB_WORKSPACE"
          ls -l "$GITHUB_WORKSPACE"/boaz-*.tgz

      # Before staging, so a failed stage still leaves an installable release.
      - name: Attach the tarball to the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          tgz=$(ls boaz-*.tgz)
          echo "attaching $tgz to $tag"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "$tgz" --clobber
          else
            gh release create "$tag" "$tgz" --title "boaz ${tag#v}" --generate-notes
          fi

      - name: Stage on npm for human approval
        id: stage
        working-directory: packages/boaz
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -o pipefail
          version=$(node -p "require('./package.json').version")

          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "staging with the NPM_TOKEN secret"
            how="the NPM_TOKEN secret"
          elif [ "${{ vars.NPM_TRUSTED_PUBLISHER }}" = "true" ]; then
            echo "staging with trusted publishing (OIDC)"
            unset NODE_AUTH_TOKEN
            how="trusted publishing (OIDC)"
          else
            echo "staged=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No npm credential configured, so ${version} was not staged. The tarball on the GitHub release is the install path."
            {
              echo "### Not staged on npm"
              echo ""
              echo "No npm credential: neither a \`NPM_TOKEN\` secret nor the"
              echo "\`NPM_TRUSTED_PUBLISHER\` repo variable is set. The tarball on the"
              echo "GitHub release is the install path."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # No 2FA prompt on staging, by design; approval is where the human enters.
          # Not left to bash -e: a failed stage must say so in the summary.
          if ! npm stage publish --access public --provenance 2>&1 | tee stage-output.txt; then
            echo "staged=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Staging ${version} failed"
              echo ""
              echo '```'
              grep -iE 'npm (error|warn)' stage-output.txt | tail -20
              tail -n 5 stage-output.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "staged=true" >> "$GITHUB_OUTPUT"
          {
            echo "### Staged ${version} on npm, awaiting approval"
            echo ""
            echo "Staged with ${how}. Nothing is installable until you approve it:"
            echo ""
            echo '```'
            tail -n 12 stage-output.txt
            echo '```'
            echo ""
            echo "Approve or reject it yourself, with your authenticator:"
            echo ""
            echo '```'
            echo "npm stage list boaz"
            echo "npm stage approve <stage-id>   # publishes ${version}"
            echo "npm stage reject <stage-id>    # throws it away"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
